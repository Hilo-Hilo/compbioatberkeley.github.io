<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Computational Biology at Berkeley</title>
    <script>
      (function () {
        var projectName = "compbioatberkeley.github.io";
        var pathSegments = window.location.pathname.split("/").filter(Boolean);
        var isProjectPage =
          window.location.hostname.endsWith(".github.io") &&
          pathSegments[0] === projectName;
        var basePath = isProjectPage ? "/" + projectName + "/" : "/";

        sessionStorage.redirect = window.location.href;
        window.location.replace(basePath);
      })();
    </script>
  </head>
  <body></body>
</html>
