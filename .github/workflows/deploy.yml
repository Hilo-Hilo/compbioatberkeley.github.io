# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Rebuild only when a published notice expires. Current study session cleanup:
  # November 17 at 06:10 UTC = November 16 at 10:10 p.m. PST.
  schedule:
    - cron: '10 * * * *'

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  # Queue expiry checks behind a release instead of canceling its deployment.
  cancel-in-progress: false

jobs:
  notice-expiry:
    if: github.repository == 'CompbioAtBerkeley/compbioatberkeley.github.io'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Check expiration or accept requested deployment
        id: check
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ "$TRIGGER" = "schedule" ]; then
            node scripts/check-notice-expiry.mjs
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
  # Single deploy job since we're just deploying
  deploy:
    needs: notice-expiry
    if: needs.notice-expiry.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload dist folder
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
